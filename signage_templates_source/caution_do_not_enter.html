<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CAUTION — Do Not Enter · Authorized Personnel Only</title>
<style>
  @page { size: Letter portrait; margin: 0.4in; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    color: #000;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .sign {
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    border: 8px solid #000;
    border-radius: 14px;
    padding: 14px;
    gap: 10px;
  }
  .header {
    flex: 0 0 18%;
    background: #fcd116;
    border: 6px solid #000;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 0 20px;
  }
  .alert-tri svg { width: 96px; height: 96px; }
  .header .word {
    color: #000;
    font-size: 96pt;
    font-weight: 900;
    letter-spacing: 0.04em;
    line-height: 1;
  }
  .body {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1.4fr;
    gap: 18px;
    padding: 8px 4px;
  }
  .pictogram {
    background: #fff;
    border: 4px solid #000;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pictogram svg { width: 88%; height: 88%; }
  .text-block {
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: left;
    border: 4px solid #000;
    border-radius: 6px;
    padding: 16px 18px;
  }
  .heading {
    font-size: 52pt;
    font-weight: 900;
    line-height: 0.95;
    margin-bottom: 10px;
  }
  .row {
    font-size: 26pt;
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 8px;
  }
</style>
</head>
<body>
  <div class="sign">
    <div class="header">
      <div class="alert-tri" aria-hidden="true">
        <svg viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
          <polygon points="50,4 96,86 4,86" fill="#000" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
          <rect x="46" y="26" width="8" height="32" fill="#fcd116"/>
          <circle cx="50" cy="68" r="5" fill="#fcd116"/>
        </svg>
      </div>
      <div class="word">CAUTION</div>
    </div>
    <div class="body">
      <div class="pictogram" aria-hidden="true">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <circle cx="100" cy="100" r="84" fill="none" stroke="#d20a16" stroke-width="16"/>
          <path d="M70 100 L70 70 C70 64 76 60 80 60 C84 60 88 64 88 70 L88 92
                   L88 56 C88 50 94 46 98 46 C102 46 106 50 106 56 L106 92
                   L106 50 C106 44 112 40 116 40 C120 40 124 44 124 50 L124 96
                   L124 64 C124 58 130 54 134 54 C138 54 142 58 142 64 L142 110
                   C142 132 124 148 104 148 L82 148 C68 148 56 138 56 124 L56 102
                   C56 96 62 92 66 92 C70 92 70 96 70 100 Z" fill="#000"/>
          <line x1="40" y1="40" x2="160" y2="160" stroke="#d20a16" stroke-width="16" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="text-block">
        <div class="heading">DO NOT</div>
        <div class="heading" style="margin-bottom:18px;">ENTER</div>
        <div class="row">Construction area.</div>
        <div class="row">Authorized personnel only.</div>
      </div>
    </div>
  </div>
</body>
</html>
