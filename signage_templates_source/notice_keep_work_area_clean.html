<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NOTICE — Keep Work Area Clean</title>
<style>
  @page { size: Letter portrait; margin: 0.4in; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    color: #000;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .sign {
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    border: 8px solid #000;
    border-radius: 14px;
    padding: 18px;
    gap: 14px;
  }
  .header {
    flex: 0 0 22%;
    background: #1b5cb3;
    border-radius: 6px;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .header svg { width: 100%; height: 100%; }
  .body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px 8px;
  }
  .body svg { width: 100%; height: 100%; }
</style>
</head>
<body>
  <div class="sign">
    <div class="header">
      <svg viewBox="0 0 100 22" preserveAspectRatio="xMidYMid meet" aria-label="NOTICE">
        <text x="50" y="18" text-anchor="middle"
              textLength="80" lengthAdjust="spacingAndGlyphs"
              font-family="Arial Black, Helvetica, sans-serif"
              font-style="italic"
              font-weight="900" font-size="20" fill="#fff">NOTICE</text>
      </svg>
    </div>
    <div class="body">
      <svg viewBox="0 0 100 40" preserveAspectRatio="xMidYMid meet" aria-label="KEEP WORK AREA CLEAN">
        <text x="50" y="18" text-anchor="middle"
              textLength="80" lengthAdjust="spacingAndGlyphs"
              font-family="Arial Black, Helvetica, sans-serif"
              font-weight="900" font-size="14" fill="#000">KEEP WORK</text>
        <text x="50" y="36" text-anchor="middle"
              textLength="88" lengthAdjust="spacingAndGlyphs"
              font-family="Arial Black, Helvetica, sans-serif"
              font-weight="900" font-size="14" fill="#000">AREA CLEAN</text>
      </svg>
    </div>
  </div>
</body>
</html>
