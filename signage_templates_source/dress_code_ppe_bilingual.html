<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Job Site Dress Code (EN/ES) — PPE Required</title>
<style>
  @page { size: Letter portrait; margin: 0.4in; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    color: #000;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .sign {
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    border: 10px solid #1b5cb3;
    border-radius: 14px;
    overflow: hidden;
  }
  .top-band {
    background: #fcd116;
    padding: 8px 12px;
    flex: 0 0 13%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  .top-band .en { flex: 1; width: 100%; }
  .top-band .es { flex: 0 0 38%; width: 100%; }
  .top-band svg { width: 100%; height: 100%; }
  .blue-band {
    background: #1b5cb3;
    color: #fff;
    padding: 8px 12px;
    flex: 0 0 16%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  .blue-band .en { flex: 1; width: 100%; }
  .blue-band .es { flex: 0 0 38%; width: 100%; }
  .blue-band svg { width: 100%; height: 100%; }
  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 6px;
    padding: 8px;
  }
  .cell {
    background: #ffffff;
    border: 2px solid #1b5cb3;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4px 4px 5px;
    gap: 2px;
  }
  .icon {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon svg { width: 78%; height: 78%; max-height: 1.05in; }
  .label-en {
    font-size: 10pt;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    text-align: center;
    color: #000;
    line-height: 1.05;
  }
  .label-es {
    font-size: 8pt;
    font-weight: 700;
    text-align: center;
    color: #54505a;
    line-height: 1.1;
  }
</style>
</head>
<body>
  <div class="sign">
    <div class="top-band">
      <div class="en">
        <svg viewBox="0 0 100 16" preserveAspectRatio="xMidYMid meet" aria-label="JOB SITE DRESS CODE">
          <text x="50" y="14" text-anchor="middle"
                textLength="92" lengthAdjust="spacingAndGlyphs"
                font-family="Arial Black, Helvetica, sans-serif"
                font-weight="900" font-size="13" fill="#000">JOB SITE DRESS CODE</text>
        </svg>
      </div>
      <div class="es">
        <svg viewBox="0 0 100 14" preserveAspectRatio="xMidYMid meet" aria-label="Codigo de vestimenta">
          <text x="50" y="12" text-anchor="middle"
                textLength="94" lengthAdjust="spacingAndGlyphs"
                font-family="Arial Black, Helvetica, sans-serif"
                font-weight="800" font-size="8" fill="#000">CÓDIGO DE VESTIMENTA EN EL LUGAR DE TRABAJO</text>
        </svg>
      </div>
    </div>
    <div class="blue-band">
      <div class="en">
        <svg viewBox="0 0 100 18" preserveAspectRatio="xMidYMid meet" aria-label="Personal Protective Equipment Required">
          <text x="50" y="15" text-anchor="middle"
                textLength="94" lengthAdjust="spacingAndGlyphs"
                font-family="Arial Black, Helvetica, sans-serif"
                font-weight="900" font-size="11" fill="#fff">PERSONAL PROTECTIVE EQUIPMENT REQUIRED</text>
        </svg>
      </div>
      <div class="es">
        <svg viewBox="0 0 100 14" preserveAspectRatio="xMidYMid meet" aria-label="Equipo de proteccion personal es obligatorio">
          <text x="50" y="12" text-anchor="middle"
                textLength="94" lengthAdjust="spacingAndGlyphs"
                font-family="Arial Black, Helvetica, sans-serif"
                font-weight="800" font-size="8" fill="#fff">EQUIPO DE PROTECCIÓN PERSONAL ES OBLIGATORIO</text>
        </svg>
      </div>
    </div>
    <div class="grid">
      <div class="cell">
        <div class="icon">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 22 C30 22 16 38 16 60 L16 70 L84 70 L84 60 C84 38 70 22 50 22 Z" fill="#fcd116" stroke="#000" stroke-width="3"/>
            <rect x="12" y="68" width="76" height="9" rx="2" fill="#fcd116" stroke="#000" stroke-width="3"/>
            <rect x="46" y="22" width="8" height="18" fill="#d4a200"/>
          </svg>
        </div>
        <div class="label-en">Hard Hat</div>
        <div class="label-es">Casco Protector</div>
      </div>
      <div class="cell">
        <div class="icon">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 50 C8 40 18 36 30 36 L42 36 C46 36 48 38 50 40 C52 38 54 36 58 36 L70 36 C82 36 92 40 92 50 L92 60 C92 70 82 74 70 74 L58 74 C54 74 52 72 50 70 C48 72 46 74 42 74 L30 74 C18 74 8 70 8 60 Z" fill="#1b5cb3" stroke="#000" stroke-width="3"/>
            <ellipse cx="30" cy="55" rx="11" ry="10" fill="#9bc6ff" stroke="#000" stroke-width="1.5"/>
            <ellipse cx="70" cy="55" rx="11" ry="10" fill="#9bc6ff" stroke="#000" stroke-width="1.5"/>
            <line x1="41" y1="55" x2="59" y2="55" stroke="#000" stroke-width="3"/>
          </svg>
        </div>
        <div class="label-en">Eye Protection</div>
        <div class="label-es">Lentes de Protección</div>
      </div>
      <div class="cell">
        <div class="icon">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="50" cy="62" rx="32" ry="8" fill="none" stroke="#000" stroke-width="3"/>
            <path d="M18 62 C18 38 30 22 50 22 C70 22 82 38 82 62" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/>
            <ellipse cx="22" cy="62" rx="12" ry="16" fill="#fcd116" stroke="#000" stroke-width="3"/>
            <ellipse cx="78" cy="62" rx="12" ry="16" fill="#fcd116" stroke="#000" stroke-width="3"/>
            <ellipse cx="22" cy="62" rx="6" ry="9" fill="#3a2c20"/>
            <ellipse cx="78" cy="62" rx="6" ry="9" fill="#3a2c20"/>
          </svg>
        </div>
        <div class="label-en">Hearing Protection</div>
        <div class="label-es">Protección Auditiva</div>
      </div>
      <div class="cell">
        <div class="icon">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 50 C18 38 32 30 50 30 C68 30 82 38 82 50 L82 64 C82 76 70 84 50 84 C30 84 18 76 18 64 Z" fill="#ffffff" stroke="#000" stroke-width="3.5"/>
            <path d="M22 45 L78 45" stroke="#000" stroke-width="2.5"/>
            <path d="M22 56 L78 56" stroke="#000" stroke-width="2.5"/>
            <path d="M22 67 L78 67" stroke="#000" stroke-width="2.5"/>
            <circle cx="38" cy="76" r="5" fill="#fff" stroke="#000" stroke-width="2.5"/>
            <circle cx="62" cy="76" r="5" fill="#fff" stroke="#000" stroke-width="2.5"/>
            <path d="M10 38 L18 46" stroke="#000" stroke-width="3" stroke-linecap="round"/>
            <path d="M90 38 L82 46" stroke="#000" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="label-en">Respirator</div>
        <div class="label-es">Respirador</div>
      </div>
      <div class="cell">
        <div class="icon">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M28 18 L42 18 L50 26 L58 18 L72 18 L80 30 L80 86 L60 86 L60 50 L40 50 L40 86 L20 86 L20 30 Z" fill="#d8e739" stroke="#000" stroke-width="3"/>
            <rect x="20" y="58" width="60" height="5" fill="#c8c8c8" stroke="#000" stroke-width="1.5"/>
            <rect x="20" y="74" width="60" height="5" fill="#c8c8c8" stroke="#000" stroke-width="1.5"/>
            <circle cx="50" cy="40" r="4" fill="#1b3a78"/>
          </svg>
        </div>
        <div class="label-en">Hi-Vis Vest</div>
        <div class="label-es">Chaleco Reflectante</div>
      </div>
      <div class="cell">
        <div class="icon">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M28 32 L34 32 L34 18 C34 14 38 12 42 12 C46 12 48 14 48 18 L48 32 L52 32 L52 12 C52 8 56 6 60 6 C64 6 66 8 66 12 L66 32 L70 32 L70 16 C70 12 74 10 78 10 C82 10 84 12 84 16 L84 58 C84 76 72 90 56 90 L44 90 C32 90 26 78 26 66 Z" fill="#fcd116" stroke="#000" stroke-width="3"/>
            <path d="M30 60 L80 60" stroke="#000" stroke-width="2" fill="none"/>
          </svg>
        </div>
        <div class="label-en">Work Gloves</div>
        <div class="label-es">Guantes de Trabajo</div>
      </div>
      <div class="cell">
        <div class="icon">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 28 L42 28 L42 58 L74 58 L86 68 L86 78 L20 78 Z" fill="#5a3a26" stroke="#000" stroke-width="3"/>
            <rect x="18" y="76" width="70" height="8" fill="#1a1a1a" stroke="#000" stroke-width="1.5"/>
            <line x1="28" y1="38" x2="38" y2="38" stroke="#000" stroke-width="2"/>
            <line x1="28" y1="46" x2="38" y2="46" stroke="#000" stroke-width="2"/>
            <line x1="28" y1="54" x2="38" y2="54" stroke="#000" stroke-width="2"/>
            <circle cx="33" cy="38" r="1.5" fill="#d4a200"/>
            <circle cx="33" cy="46" r="1.5" fill="#d4a200"/>
            <circle cx="33" cy="54" r="1.5" fill="#d4a200"/>
            <rect x="40" y="58" width="6" height="20" fill="#5a3a26" stroke="#000" stroke-width="2"/>
          </svg>
        </div>
        <div class="label-en">Work Boots</div>
        <div class="label-es">Botas de Trabajo</div>
      </div>
      <div class="cell">
        <div class="icon">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M28 16 L72 16 L74 26 L62 90 L52 90 L50 38 L48 90 L38 90 L26 26 Z" fill="#1b3a78" stroke="#000" stroke-width="3"/>
            <line x1="50" y1="16" x2="50" y2="38" stroke="#000" stroke-width="2"/>
            <rect x="32" y="22" width="8" height="10" fill="none" stroke="#000" stroke-width="1.5"/>
            <rect x="60" y="22" width="8" height="10" fill="none" stroke="#000" stroke-width="1.5"/>
          </svg>
        </div>
        <div class="label-en">Long Trousers</div>
        <div class="label-es">Pantalones Largos</div>
      </div>
    </div>
  </div>
</body>
</html>
