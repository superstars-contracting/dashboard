<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Job Site Dress Code (EN/ES) — Personal Protective Equipment Required</title>
<style>
  @page { size: Letter landscape; margin: 0.25in; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    color: #000;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .sign {
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    border: 4px solid #000;
    border-radius: 8px;
    padding: 8px;
    gap: 6px;
    background: #fff;
    overflow: hidden;
  }
  .header-band {
    background: #fcd116;
    border: 3px solid #000;
    border-radius: 4px;
    padding: 4px 18px;
    flex: 0 0 18%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
  }
  .header-band .en { flex: 1; width: 100%; min-height: 0; }
  .header-band .es { flex: 0 0 38%; width: 100%; min-height: 0; }
  .header-band svg { width: 100%; height: 100%; display: block; }
  .message {
    flex: 0 0 18%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 14px;
    gap: 1px;
  }
  .message .en { flex: 1; width: 100%; min-height: 0; }
  .message .es { flex: 0 0 38%; width: 100%; min-height: 0; }
  .message svg { width: 100%; height: 100%; display: block; }
  .pictos {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: minmax(0, 1fr);
    gap: 8px;
    padding: 4px 8px 6px;
    align-items: center;
  }
  .ppe-slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    height: 100%;
    overflow: hidden;
  }
  .ppe {
    flex: 1;
    aspect-ratio: 1 / 1;
    background: #1b5cb3;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    max-height: 100%;
    max-width: 100%;
  }
  .ppe svg { width: 66%; height: 66%; fill: #fff; }
  .label-en {
    font-family: Inter, "Helvetica Neue", Arial, sans-serif;
    font-size: 9pt;
    font-weight: 800;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: #000;
    text-align: center;
    line-height: 1.05;
  }
  .label-es {
    font-family: Inter, "Helvetica Neue", Arial, sans-serif;
    font-size: 7.5pt;
    font-weight: 600;
    color: #54505a;
    text-align: center;
    line-height: 1.1;
  }
</style>
</head>
<body>
  <div class="sign">
    <div class="header-band">
      <div class="en">
        <svg viewBox="0 0 100 18" preserveAspectRatio="xMidYMid meet" aria-label="JOB SITE DRESS CODE">
          <text x="50" y="15" text-anchor="middle"
                textLength="94" lengthAdjust="spacingAndGlyphs"
                font-family="Arial Black, Helvetica, sans-serif"
                font-weight="900" font-size="14" fill="#000">JOB SITE DRESS CODE</text>
        </svg>
      </div>
      <div class="es">
        <svg viewBox="0 0 100 14" preserveAspectRatio="xMidYMid meet" aria-label="Codigo de vestimenta en el lugar de trabajo">
          <text x="50" y="12" text-anchor="middle"
                textLength="94" lengthAdjust="spacingAndGlyphs"
                font-family="Arial Black, Helvetica, sans-serif"
                font-weight="800" font-size="8" fill="#000">CÓDIGO DE VESTIMENTA EN EL LUGAR DE TRABAJO</text>
        </svg>
      </div>
    </div>
    <div class="message">
      <div class="en">
        <svg viewBox="0 0 100 18" preserveAspectRatio="xMidYMid meet" aria-label="All PPE Required On Site">
          <text x="50" y="15" text-anchor="middle"
                textLength="92" lengthAdjust="spacingAndGlyphs"
                font-family="Arial Black, Helvetica, sans-serif"
                font-weight="900" font-size="14" fill="#000">ALL PPE REQUIRED ON SITE</text>
        </svg>
      </div>
      <div class="es">
        <svg viewBox="0 0 100 14" preserveAspectRatio="xMidYMid meet" aria-label="Se requiere todo el EPP en la obra">
          <text x="50" y="12" text-anchor="middle"
                textLength="94" lengthAdjust="spacingAndGlyphs"
                font-family="Arial Black, Helvetica, sans-serif"
                font-weight="800" font-size="9" fill="#000">SE REQUIERE TODO EL EPP EN LA OBRA</text>
        </svg>
      </div>
    </div>
    <div class="pictos">
      <div class="ppe-slot">
        <div class="ppe" aria-label="Hard hat">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 24 C32 24 18 38 18 58 L18 70 L82 70 L82 58 C82 38 68 24 50 24 Z"/>
            <rect x="14" y="68" width="72" height="8" rx="2"/>
            <rect x="46" y="24" width="8" height="14"/>
          </svg>
        </div>
        <div class="label-en">Hard Hat</div>
        <div class="label-es">Casco</div>
      </div>
      <div class="ppe-slot">
        <div class="ppe" aria-label="Eye Protection">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 46 C12 38 20 34 30 34 L42 34 C46 34 48 36 50 38 C52 36 54 34 58 34 L70 34 C80 34 88 38 88 46 L88 56 C88 64 80 68 70 68 L58 68 C54 68 52 66 50 64 C48 66 46 68 42 68 L30 68 C20 68 12 64 12 56 Z"/>
            <ellipse cx="32" cy="51" rx="10" ry="9" fill="#1b5cb3"/>
            <ellipse cx="68" cy="51" rx="10" ry="9" fill="#1b5cb3"/>
          </svg>
        </div>
        <div class="label-en">Eye Protection</div>
        <div class="label-es">Lentes</div>
      </div>
      <div class="ppe-slot">
        <div class="ppe" aria-label="Hearing Protection">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M22 38 C22 30 28 24 36 24 L36 76 C28 76 22 70 22 62 Z"/>
            <path d="M78 38 C78 30 72 24 64 24 L64 76 C72 76 78 70 78 62 Z"/>
            <rect x="36" y="46" width="28" height="8"/>
          </svg>
        </div>
        <div class="label-en">Hearing Protection</div>
        <div class="label-es">Protección Auditiva</div>
      </div>
      <div class="ppe-slot">
        <div class="ppe" aria-label="Respirator">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 50 C18 38 32 30 50 30 C68 30 82 38 82 50 L82 64 C82 76 70 84 50 84 C30 84 18 76 18 64 Z" fill="#fff" stroke="#fff"/>
            <path d="M22 45 L78 45" stroke="#1b5cb3" stroke-width="3"/>
            <path d="M22 56 L78 56" stroke="#1b5cb3" stroke-width="3"/>
            <path d="M22 67 L78 67" stroke="#1b5cb3" stroke-width="3"/>
            <circle cx="38" cy="78" r="5" fill="#1b5cb3"/>
            <circle cx="62" cy="78" r="5" fill="#1b5cb3"/>
          </svg>
        </div>
        <div class="label-en">Respirator</div>
        <div class="label-es">Respirador</div>
      </div>
      <div class="ppe-slot">
        <div class="ppe" aria-label="Hi-Vis Vest">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M30 22 L42 22 L50 30 L58 22 L70 22 L78 32 L78 80 L60 80 L60 50 L40 50 L40 80 L22 80 L22 32 Z"/>
            <rect x="22" y="56" width="56" height="4" fill="#1b5cb3"/>
            <rect x="22" y="68" width="56" height="4" fill="#1b5cb3"/>
          </svg>
        </div>
        <div class="label-en">Hi-Vis Vest</div>
        <div class="label-es">Chaleco</div>
      </div>
      <div class="ppe-slot">
        <div class="ppe" aria-label="Work Gloves">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M30 30 L36 30 L36 18 C36 14 40 12 44 12 C48 12 50 14 50 18 L50 30 L54 30 L54 12 C54 8 58 6 62 6 C66 6 68 8 68 12 L68 30 L72 30 L72 16 C72 12 76 10 80 10 C84 10 86 12 86 16 L86 56 C86 70 76 86 60 86 L48 86 C36 86 30 76 30 66 Z"/>
          </svg>
        </div>
        <div class="label-en">Work Gloves</div>
        <div class="label-es">Guantes</div>
      </div>
      <div class="ppe-slot">
        <div class="ppe" aria-label="Work Boots">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M22 30 L40 30 L40 56 L70 56 L80 64 L80 76 L22 76 Z"/>
            <rect x="22" y="76" width="58" height="6"/>
            <rect x="26" y="80" width="6" height="4" fill="#1b5cb3"/>
            <rect x="38" y="80" width="6" height="4" fill="#1b5cb3"/>
            <rect x="50" y="80" width="6" height="4" fill="#1b5cb3"/>
            <rect x="62" y="80" width="6" height="4" fill="#1b5cb3"/>
          </svg>
        </div>
        <div class="label-en">Work Boots</div>
        <div class="label-es">Botas</div>
      </div>
      <div class="ppe-slot">
        <div class="ppe" aria-label="Long Trousers">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <path d="M30 18 L70 18 L72 28 L62 86 L52 86 L50 40 L48 86 L38 86 L28 28 Z"/>
            <line x1="50" y1="18" x2="50" y2="40" stroke="#1b5cb3" stroke-width="2"/>
          </svg>
        </div>
        <div class="label-en">Long Trousers</div>
        <div class="label-es">Pantalones Largos</div>
      </div>
    </div>
  </div>
</body>
</html>
