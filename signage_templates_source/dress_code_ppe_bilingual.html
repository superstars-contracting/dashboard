<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Job Site Dress Code (EN/ES) — PPE Required / Equipo de Protección Personal Es Obligatorio</title>
<style>
  @page { size: Letter portrait; margin: 0.4in; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    color: #000;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .sign {
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    border: 10px solid #1b5cb3;
    border-radius: 14px;
    overflow: hidden;
  }
  .top-band {
    background: #fcd116;
    text-align: center;
    padding: 10px 8px 12px;
  }
  .top-band .en {
    font-size: 36pt;
    font-weight: 900;
    letter-spacing: 0.04em;
    color: #000;
    line-height: 1;
  }
  .top-band .es {
    font-size: 14pt;
    font-weight: 800;
    letter-spacing: 0.03em;
    color: #000;
    line-height: 1.1;
    margin-top: 4px;
  }
  .blue-band {
    background: #1b5cb3;
    color: #fff;
    text-align: center;
    padding: 12px 8px 14px;
  }
  .blue-band .en {
    font-size: 24pt;
    font-weight: 900;
    line-height: 1.0;
    letter-spacing: 0.04em;
  }
  .blue-band .es {
    font-size: 13pt;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: 0.03em;
    margin-top: 4px;
  }
  .figure {
    flex: 1;
    position: relative;
    padding: 10px;
  }
  .figure svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .lbl-en {
    font: 700 12pt "Arial", sans-serif;
    fill: #000;
  }
  .lbl-es {
    font: 600 9.5pt "Arial", sans-serif;
    fill: #1a1a1a;
  }
  .lead {
    stroke: #000;
    stroke-width: 1.4;
    fill: none;
  }
</style>
</head>
<body>
  <div class="sign">
    <div class="top-band">
      <div class="en">JOB SITE DRESS CODE</div>
      <div class="es">CÓDIGO DE VESTIMENTA EN EL LUGAR DE TRABAJO</div>
    </div>
    <div class="blue-band">
      <div class="en">PERSONAL PROTECTIVE EQUIPMENT REQUIRED</div>
      <div class="es">EQUIPO DE PROTECCIÓN PERSONAL ES OBLIGATORIO</div>
    </div>
    <div class="figure">
      <svg viewBox="0 0 600 760" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
        <!-- hard hat -->
        <path d="M225 105 C235 78 285 70 300 70 C315 70 365 78 375 105 L390 132 L210 132 Z" fill="#fcd116" stroke="#000" stroke-width="3"/>
        <rect x="210" y="132" width="180" height="14" fill="#fcd116" stroke="#000" stroke-width="3"/>
        <rect x="290" y="78" width="20" height="30" fill="#e0a800"/>
        <!-- face -->
        <path d="M240 146 L240 220 C240 252 268 270 300 270 C332 270 360 252 360 220 L360 146 Z" fill="#e8b894" stroke="#000" stroke-width="2.5"/>
        <!-- hearing muffs -->
        <ellipse cx="232" cy="194" rx="20" ry="28" fill="#fcd116" stroke="#000" stroke-width="2.5"/>
        <ellipse cx="368" cy="194" rx="20" ry="28" fill="#fcd116" stroke="#000" stroke-width="2.5"/>
        <path d="M232 168 C232 144 368 144 368 168" fill="none" stroke="#000" stroke-width="3.5"/>
        <!-- glasses -->
        <rect x="252" y="174" width="38" height="22" rx="6" fill="#9bc6ff" stroke="#000" stroke-width="2"/>
        <rect x="310" y="174" width="38" height="22" rx="6" fill="#9bc6ff" stroke="#000" stroke-width="2"/>
        <line x1="290" y1="186" x2="310" y2="186" stroke="#000" stroke-width="2"/>
        <!-- respirator -->
        <path d="M258 218 C258 246 342 246 342 218 L342 244 C342 256 326 264 300 264 C274 264 258 256 258 244 Z" fill="#fff" stroke="#000" stroke-width="2.5"/>
        <line x1="262" y1="226" x2="338" y2="226" stroke="#000" stroke-width="1.5"/>
        <line x1="262" y1="236" x2="338" y2="236" stroke="#000" stroke-width="1.5"/>
        <!-- neck + shirt -->
        <rect x="282" y="270" width="36" height="20" fill="#e8b894" stroke="#000" stroke-width="2"/>
        <!-- vest -->
        <path d="M205 290 L260 285 L300 308 L340 285 L395 290 L395 460 L335 460 L335 320 L265 320 L265 460 L205 460 Z" fill="#d8e739" stroke="#000" stroke-width="3"/>
        <rect x="205" y="370" width="190" height="14" fill="#c8c8c8" stroke="#000" stroke-width="1.5"/>
        <rect x="205" y="408" width="190" height="14" fill="#c8c8c8" stroke="#000" stroke-width="1.5"/>
        <rect x="172" y="295" width="34" height="160" fill="#2a5cba" stroke="#000" stroke-width="2.5"/>
        <rect x="394" y="295" width="34" height="160" fill="#2a5cba" stroke="#000" stroke-width="2.5"/>
        <ellipse cx="155" cy="465" rx="32" ry="42" fill="#fcd116" stroke="#000" stroke-width="2.5"/>
        <ellipse cx="445" cy="465" rx="32" ry="42" fill="#fcd116" stroke="#000" stroke-width="2.5"/>
        <path d="M205 460 L300 460 L395 460 L390 660 L320 660 L300 480 L280 660 L210 660 Z" fill="#1b3a78" stroke="#000" stroke-width="3"/>
        <path d="M210 660 L290 660 L286 700 L196 700 Z" fill="#33312f" stroke="#000" stroke-width="2.5"/>
        <path d="M320 660 L400 660 L414 700 L324 700 Z" fill="#33312f" stroke="#000" stroke-width="2.5"/>
        <rect x="196" y="700" width="100" height="10" fill="#1a1a1a"/>
        <rect x="320" y="700" width="100" height="10" fill="#1a1a1a"/>

        <!-- bilingual labels -->
        <text class="lbl-en" x="430" y="92">Hard Hat</text>
        <text class="lbl-es" x="430" y="110">Casco Protector</text>
        <path class="lead" d="M425 96 L390 110"/>

        <text class="lbl-en" x="60" y="170">Eye Protection</text>
        <text class="lbl-es" x="60" y="188">Lentes de Protección</text>
        <path class="lead" d="M170 184 L252 188"/>

        <text class="lbl-en" x="60" y="220">Hearing Protection</text>
        <text class="lbl-es" x="60" y="238">Protección Auditiva</text>
        <text class="lbl-es" x="60" y="252">(cuando sea requerida)</text>
        <path class="lead" d="M170 226 L212 200"/>

        <text class="lbl-en" x="420" y="220">Appropriate Respirator</text>
        <text class="lbl-es" x="420" y="238">Aparato de Respiración</text>
        <text class="lbl-es" x="420" y="252">Adecuado</text>
        <path class="lead" d="M425 230 L348 232"/>

        <text class="lbl-en" x="430" y="365">High Visibility Vest</text>
        <text class="lbl-es" x="430" y="383">Chaleco Reflectante</text>
        <text class="lbl-es" x="430" y="397">de Alta Visibilidad</text>
        <path class="lead" d="M425 360 L398 372"/>

        <text class="lbl-en" x="40" y="455">Work Gloves</text>
        <text class="lbl-es" x="40" y="473">Guantes de Trabajo</text>
        <text class="lbl-es" x="40" y="487">(cuando sean requeridos)</text>
        <path class="lead" d="M130 470 L122 470"/>

        <text class="lbl-en" x="60" y="590">Long Trousers</text>
        <text class="lbl-es" x="60" y="608">Pantalones Largos</text>
        <path class="lead" d="M170 595 L235 590"/>

        <text class="lbl-en" x="430" y="690">Work Shoes</text>
        <text class="lbl-es" x="430" y="708">Zapatos de Trabajo</text>
        <path class="lead" d="M425 695 L400 700"/>
      </svg>
    </div>
  </div>
</body>
</html>
