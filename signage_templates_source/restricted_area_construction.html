<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RESTRICTED AREA — Construction Work in Progress (DOB U-1012-01)</title>
<style>
  @page { size: Letter portrait; margin: 0.4in; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    color: #000;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .sign {
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    border: 8px solid #000;
    border-radius: 8px;
    overflow: hidden;
  }
  .header {
    flex: 0 0 32%;
    background: #d20a16;
    padding: 18px 22px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .header svg { width: 100%; height: 100%; }
  .divider { height: 6px; background: #000; }
  .body {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 24px 22px 18px;
    gap: 8px;
  }
  .body svg { width: 100%; flex: 1; }
  .ref {
    font-size: 11pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #444;
    text-align: center;
    margin-top: 6px;
  }
</style>
</head>
<body>
  <div class="sign">
    <div class="header">
      <!-- "RESTRICTED AREA" — two lines in white. viewBox tuned so text
           fills width without clipping; preserveAspectRatio="xMidYMid meet"
           guarantees the longest word fits the inner box. -->
      <svg viewBox="0 0 100 42" preserveAspectRatio="xMidYMid meet" aria-label="RESTRICTED AREA">
        <text x="50" y="20" text-anchor="middle"
              textLength="92" lengthAdjust="spacingAndGlyphs"
              font-family="Arial Black, Helvetica, sans-serif"
              font-weight="900" font-size="18" fill="#fff">RESTRICTED</text>
        <text x="50" y="38" text-anchor="middle"
              textLength="40" lengthAdjust="spacingAndGlyphs"
              font-family="Arial Black, Helvetica, sans-serif"
              font-weight="900" font-size="18" fill="#fff">AREA</text>
      </svg>
    </div>
    <div class="divider"></div>
    <div class="body">
      <svg viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet" aria-label="CONSTRUCTION WORK IN PROGRESS">
        <text x="50" y="18" text-anchor="middle"
              textLength="92" lengthAdjust="spacingAndGlyphs"
              font-family="Arial Black, Helvetica, sans-serif"
              font-weight="900" font-size="14" fill="#000">CONSTRUCTION</text>
        <text x="50" y="38" text-anchor="middle"
              textLength="58" lengthAdjust="spacingAndGlyphs"
              font-family="Arial Black, Helvetica, sans-serif"
              font-weight="900" font-size="14" fill="#000">WORK IN</text>
        <text x="50" y="58" text-anchor="middle"
              textLength="68" lengthAdjust="spacingAndGlyphs"
              font-family="Arial Black, Helvetica, sans-serif"
              font-weight="900" font-size="14" fill="#000">PROGRESS</text>
      </svg>
      <div class="ref">NYC DOB · U-1012-01</div>
    </div>
  </div>
</body>
</html>
