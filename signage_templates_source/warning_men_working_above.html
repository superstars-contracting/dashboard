<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WARNING — Men Working Above</title>
<style>
  @page { size: Letter portrait; margin: 0.4in; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    color: #000;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .sign {
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    border: 8px solid #000;
    border-radius: 14px;
    padding: 18px;
  }
  .header {
    flex: 0 0 22%;
    background: #000;
    border-radius: 6px;
    padding: 8px;
    display: flex;
    align-items: stretch;
    justify-content: stretch;
  }
  .header .band {
    flex: 1;
    background: #f58220;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .header .word {
    color: #000;
    font-size: 96pt;
    font-weight: 900;
    letter-spacing: 0.04em;
    line-height: 1;
  }
  .body {
    flex: 1;
    display: grid;
    grid-template-columns: 3fr 1fr;
    gap: 24px;
    align-items: center;
    padding: 18px 8px;
  }
  .text-block {
    text-align: center;
  }
  .line {
    font-size: 78pt;
    font-weight: 900;
    line-height: 1.0;
    letter-spacing: 0.01em;
  }
  .arrow {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .arrow svg { width: 100%; height: 90%; }
</style>
</head>
<body>
  <div class="sign">
    <div class="header">
      <div class="band"><div class="word">WARNING</div></div>
    </div>
    <div class="body">
      <div class="text-block">
        <div class="line">MEN</div>
        <div class="line">WORKING</div>
        <div class="line">ABOVE</div>
      </div>
      <div class="arrow" aria-hidden="true">
        <svg viewBox="0 0 50 200" xmlns="http://www.w3.org/2000/svg">
          <polygon points="25,5 47,40 35,40 35,195 15,195 15,40 3,40" fill="#000"/>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
