<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WARNING — Men Working Above</title>
<style>
  @page { size: Letter landscape; margin: 0.4in; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    color: #000;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .sign {
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    border: 10px solid #000;
    border-radius: 14px;
    padding: 16px;
    gap: 14px;
  }
  .header {
    flex: 0 0 28%;
    background: #000;
    border-radius: 8px;
    padding: 6px;
    display: flex;
  }
  .header .band {
    flex: 1;
    background: #f58220;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 18px;
  }
  .header svg { width: 100%; height: 100%; }
  .body {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 3fr 1fr;
    grid-template-rows: minmax(0, 1fr);
    align-items: stretch;
    gap: 16px;
    padding: 0 6px;
  }
  .text-wrap, .arrow {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    min-width: 0;
    overflow: hidden;
  }
  .text-wrap svg, .arrow svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
  <div class="sign">
    <div class="header">
      <div class="band">
        <svg viewBox="0 0 100 22" preserveAspectRatio="xMidYMid meet" aria-label="WARNING">
          <text x="50" y="19" text-anchor="middle"
                textLength="92" lengthAdjust="spacingAndGlyphs"
                font-family="Arial Black, Helvetica, sans-serif"
                font-weight="900" font-size="20" fill="#000">WARNING</text>
        </svg>
      </div>
    </div>
    <div class="body">
      <div class="text-wrap">
        <svg viewBox="0 0 100 46" preserveAspectRatio="xMidYMid meet" aria-label="MEN WORKING ABOVE">
          <text x="50" y="14" text-anchor="middle"
                textLength="36" lengthAdjust="spacingAndGlyphs"
                font-family="Arial Black, Helvetica, sans-serif"
                font-weight="900" font-size="14" fill="#000">MEN</text>
          <text x="50" y="30" text-anchor="middle"
                textLength="80" lengthAdjust="spacingAndGlyphs"
                font-family="Arial Black, Helvetica, sans-serif"
                font-weight="900" font-size="14" fill="#000">WORKING</text>
          <text x="50" y="44" text-anchor="middle"
                textLength="58" lengthAdjust="spacingAndGlyphs"
                font-family="Arial Black, Helvetica, sans-serif"
                font-weight="900" font-size="14" fill="#000">ABOVE</text>
        </svg>
      </div>
      <div class="arrow" aria-hidden="true">
        <svg viewBox="0 0 50 200" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
          <polygon points="25,5 47,40 35,40 35,195 15,195 15,40 3,40" fill="#000"/>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
