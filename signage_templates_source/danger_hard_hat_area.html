<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DANGER — Hard Hat Area</title>
<style>
  @page { size: Letter portrait; margin: 0.4in; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    color: #000;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .sign {
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    border: 8px solid #000;
    border-radius: 14px;
    padding: 18px;
  }
  .header {
    flex: 0 0 22%;
    background: #000;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .header .oval {
    width: 86%;
    height: 84%;
    background: #d20a16;
    border: 6px solid #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .header .word {
    color: #fff;
    font-size: 96pt;
    font-weight: 900;
    letter-spacing: 0.04em;
    line-height: 1;
  }
  .body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 18px 8px;
  }
  .body .line {
    font-size: 130pt;
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: 0.01em;
  }
  .alert {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
  }
  .alert svg { width: 80px; height: 80px; }
</style>
</head>
<body>
  <div class="sign">
    <div class="header">
      <div class="oval"><div class="word">DANGER</div></div>
    </div>
    <div class="body">
      <div class="alert" aria-hidden="true">
        <svg viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
          <polygon points="50,4 96,86 4,86" fill="#000" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
          <polygon points="50,18 84,78 16,78" fill="#fff"/>
          <rect x="46" y="30" width="8" height="28" fill="#000"/>
          <circle cx="50" cy="66" r="5" fill="#000"/>
        </svg>
      </div>
      <div class="line">HARD HAT</div>
      <div class="line">AREA</div>
    </div>
  </div>
</body>
</html>
