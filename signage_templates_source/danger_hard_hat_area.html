<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DANGER — Hard Hat Area</title>
<style>
  @page { size: Letter landscape; margin: 0.4in; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    color: #000;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .sign {
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    border: 10px solid #000;
    border-radius: 14px;
    padding: 16px;
    gap: 14px;
  }
  .header {
    flex: 0 0 30%;
    background: #000;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
  }
  .header .oval {
    height: 86%;
    aspect-ratio: 3.4 / 1;
    background: #d20a16;
    border: 6px solid #fff;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 6%;
  }
  .header .oval svg { width: 100%; height: 78%; }
  .body {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 2.2fr;
    align-items: center;
    gap: 20px;
    padding: 4px 4px;
  }
  .alert {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
  }
  .alert svg { height: 92%; width: auto; }
  .text-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
  }
  .text-wrap svg { width: 100%; height: 100%; }
</style>
</head>
<body>
  <div class="sign">
    <div class="header">
      <div class="oval">
        <svg viewBox="0 0 100 22" preserveAspectRatio="xMidYMid meet" aria-label="DANGER">
          <text x="50" y="19" text-anchor="middle"
                textLength="86" lengthAdjust="spacingAndGlyphs"
                font-family="Arial Black, Helvetica, sans-serif"
                font-weight="900" font-size="20" fill="#fff">DANGER</text>
        </svg>
      </div>
    </div>
    <div class="body">
      <div class="alert" aria-hidden="true">
        <svg viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
          <polygon points="50,4 96,86 4,86" fill="#000" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
          <polygon points="50,18 84,78 16,78" fill="#fff"/>
          <rect x="46" y="30" width="8" height="28" fill="#000"/>
          <circle cx="50" cy="66" r="5" fill="#000"/>
        </svg>
      </div>
      <div class="text-wrap">
        <svg viewBox="0 0 100 46" preserveAspectRatio="xMidYMid meet" aria-label="HARD HAT AREA">
          <text x="50" y="20" text-anchor="middle"
                textLength="92" lengthAdjust="spacingAndGlyphs"
                font-family="Arial Black, Helvetica, sans-serif"
                font-weight="900" font-size="20" fill="#000">HARD HAT</text>
          <text x="50" y="42" text-anchor="middle"
                textLength="44" lengthAdjust="spacingAndGlyphs"
                font-family="Arial Black, Helvetica, sans-serif"
                font-weight="900" font-size="20" fill="#000">AREA</text>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
