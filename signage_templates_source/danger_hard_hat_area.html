<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DANGER — Hard Hat Area</title>
<style>
  @page { size: Letter portrait; margin: 0.4in; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    color: #000;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .sign {
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    border: 8px solid #000;
    border-radius: 14px;
    padding: 18px;
    gap: 14px;
  }
  .header {
    flex: 0 0 22%;
    background: #000;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 8px;
  }
  .header .oval {
    width: 84%;
    height: 88%;
    background: #d20a16;
    border: 6px solid #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .header svg { width: 88%; height: 80%; }
  .body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 4px 4px 0;
    gap: 10px;
  }
  .alert {
    flex: 0 0 22%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .alert svg { height: 100%; width: auto; }
  .text-wrap {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .text-wrap svg { width: 100%; height: 100%; }
</style>
</head>
<body>
  <div class="sign">
    <div class="header">
      <div class="oval">
        <svg viewBox="0 0 100 28" preserveAspectRatio="xMidYMid meet" aria-label="DANGER">
          <text x="50" y="24" text-anchor="middle"
                textLength="86" lengthAdjust="spacingAndGlyphs"
                font-family="Arial Black, Helvetica, sans-serif"
                font-weight="900" font-size="26" fill="#fff">DANGER</text>
        </svg>
      </div>
    </div>
    <div class="body">
      <div class="alert" aria-hidden="true">
        <svg viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
          <polygon points="50,4 96,86 4,86" fill="#000" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
          <polygon points="50,18 84,78 16,78" fill="#fff"/>
          <rect x="46" y="30" width="8" height="28" fill="#000"/>
          <circle cx="50" cy="66" r="5" fill="#000"/>
        </svg>
      </div>
      <div class="text-wrap">
        <svg viewBox="0 0 100 50" preserveAspectRatio="xMidYMid meet" aria-label="HARD HAT AREA">
          <text x="50" y="22" text-anchor="middle"
                textLength="92" lengthAdjust="spacingAndGlyphs"
                font-family="Arial Black, Helvetica, sans-serif"
                font-weight="900" font-size="22" fill="#000">HARD HAT</text>
          <text x="50" y="46" text-anchor="middle"
                textLength="46" lengthAdjust="spacingAndGlyphs"
                font-family="Arial Black, Helvetica, sans-serif"
                font-weight="900" font-size="22" fill="#000">AREA</text>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
