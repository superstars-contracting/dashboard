<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Job Site Dress Code — Personal Protective Equipment Required</title>
<style>
  @page { size: Letter portrait; margin: 0.4in; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    color: #000;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .sign {
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    border: 10px solid #1b5cb3;
    border-radius: 14px;
    overflow: hidden;
  }
  .top-band {
    background: #fcd116;
    text-align: center;
    padding: 12px 8px;
  }
  .top-band .t {
    font-size: 40pt;
    font-weight: 900;
    letter-spacing: 0.04em;
    color: #000;
    line-height: 1;
  }
  .blue-band {
    background: #1b5cb3;
    color: #fff;
    text-align: center;
    padding: 14px 8px;
  }
  .blue-band .t {
    font-size: 30pt;
    font-weight: 900;
    line-height: 1.0;
    letter-spacing: 0.04em;
  }
  .figure {
    flex: 1;
    position: relative;
    padding: 12px;
  }
  .figure svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .lbl {
    font: 700 13pt "Arial", sans-serif;
    fill: #000;
  }
  .lead {
    stroke: #000;
    stroke-width: 1.4;
    fill: none;
  }
</style>
</head>
<body>
  <div class="sign">
    <div class="top-band"><div class="t">JOB SITE DRESS CODE</div></div>
    <div class="blue-band"><div class="t">PERSONAL PROTECTIVE EQUIPMENT REQUIRED</div></div>
    <div class="figure">
      <svg viewBox="0 0 600 760" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
        <!-- hard hat -->
        <path d="M225 105 C235 78 285 70 300 70 C315 70 365 78 375 105 L390 132 L210 132 Z" fill="#fcd116" stroke="#000" stroke-width="3"/>
        <rect x="210" y="132" width="180" height="14" fill="#fcd116" stroke="#000" stroke-width="3"/>
        <rect x="290" y="78" width="20" height="30" fill="#e0a800"/>
        <!-- face -->
        <path d="M240 146 L240 220 C240 252 268 270 300 270 C332 270 360 252 360 220 L360 146 Z" fill="#e8b894" stroke="#000" stroke-width="2.5"/>
        <!-- hearing muffs -->
        <ellipse cx="232" cy="194" rx="20" ry="28" fill="#fcd116" stroke="#000" stroke-width="2.5"/>
        <ellipse cx="368" cy="194" rx="20" ry="28" fill="#fcd116" stroke="#000" stroke-width="2.5"/>
        <path d="M232 168 C232 144 368 144 368 168" fill="none" stroke="#000" stroke-width="3.5"/>
        <!-- glasses -->
        <rect x="252" y="174" width="38" height="22" rx="6" fill="#9bc6ff" stroke="#000" stroke-width="2"/>
        <rect x="310" y="174" width="38" height="22" rx="6" fill="#9bc6ff" stroke="#000" stroke-width="2"/>
        <line x1="290" y1="186" x2="310" y2="186" stroke="#000" stroke-width="2"/>
        <!-- respirator -->
        <path d="M258 218 C258 246 342 246 342 218 L342 244 C342 256 326 264 300 264 C274 264 258 256 258 244 Z" fill="#fff" stroke="#000" stroke-width="2.5"/>
        <line x1="262" y1="226" x2="338" y2="226" stroke="#000" stroke-width="1.5"/>
        <line x1="262" y1="236" x2="338" y2="236" stroke="#000" stroke-width="1.5"/>
        <!-- neck + shirt -->
        <rect x="282" y="270" width="36" height="20" fill="#e8b894" stroke="#000" stroke-width="2"/>
        <!-- vest (hi-vis lime over blue shirt) -->
        <path d="M205 290 L260 285 L300 308 L340 285 L395 290 L395 460 L335 460 L335 320 L265 320 L265 460 L205 460 Z" fill="#d8e739" stroke="#000" stroke-width="3"/>
        <!-- reflective stripes -->
        <rect x="205" y="370" width="190" height="14" fill="#c8c8c8" stroke="#000" stroke-width="1.5"/>
        <rect x="205" y="408" width="190" height="14" fill="#c8c8c8" stroke="#000" stroke-width="1.5"/>
        <!-- shirt sleeves (visible) -->
        <rect x="172" y="295" width="34" height="160" fill="#2a5cba" stroke="#000" stroke-width="2.5"/>
        <rect x="394" y="295" width="34" height="160" fill="#2a5cba" stroke="#000" stroke-width="2.5"/>
        <!-- gloves -->
        <ellipse cx="155" cy="465" rx="32" ry="42" fill="#fcd116" stroke="#000" stroke-width="2.5"/>
        <ellipse cx="445" cy="465" rx="32" ry="42" fill="#fcd116" stroke="#000" stroke-width="2.5"/>
        <!-- pants -->
        <path d="M205 460 L300 460 L395 460 L390 660 L320 660 L300 480 L280 660 L210 660 Z" fill="#1b3a78" stroke="#000" stroke-width="3"/>
        <!-- boots -->
        <path d="M210 660 L290 660 L286 700 L196 700 Z" fill="#33312f" stroke="#000" stroke-width="2.5"/>
        <path d="M320 660 L400 660 L414 700 L324 700 Z" fill="#33312f" stroke="#000" stroke-width="2.5"/>
        <rect x="196" y="700" width="100" height="10" fill="#1a1a1a"/>
        <rect x="320" y="700" width="100" height="10" fill="#1a1a1a"/>

        <!-- labels + leaders -->
        <!-- Hard Hat (right) -->
        <text class="lbl" x="430" y="100">Hard Hat</text>
        <path class="lead" d="M425 96 L390 110"/>
        <!-- Eye Protection (left) -->
        <text class="lbl" x="60" y="178">Eye Protection</text>
        <path class="lead" d="M170 184 L252 188"/>
        <!-- Hearing Protection (left, with helper) -->
        <text class="lbl" x="60" y="210">Hearing Protection</text>
        <text class="lbl" x="60" y="228" style="font-size:10.5pt;">(as required)</text>
        <path class="lead" d="M170 216 L212 200"/>
        <!-- Appropriate Respirator (right) -->
        <text class="lbl" x="430" y="220">Appropriate Respirator</text>
        <text class="lbl" x="430" y="238" style="font-size:10.5pt;">(as required)</text>
        <path class="lead" d="M425 230 L348 232"/>
        <!-- Hi-Vis Safety Vest (right) -->
        <text class="lbl" x="430" y="370">High Visibility Vest</text>
        <path class="lead" d="M425 366 L398 370"/>
        <!-- Work Gloves (left) -->
        <text class="lbl" x="40" y="460">Work Gloves</text>
        <text class="lbl" x="40" y="478" style="font-size:10.5pt;">(as required)</text>
        <path class="lead" d="M130 470 L122 470"/>
        <!-- Long Trousers (left) -->
        <text class="lbl" x="60" y="600">Long Trousers</text>
        <path class="lead" d="M170 595 L235 590"/>
        <!-- Work Shoes (right) -->
        <text class="lbl" x="430" y="700">Work Shoes</text>
        <path class="lead" d="M425 695 L400 700"/>
      </svg>
    </div>
  </div>
</body>
</html>
