<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CAUTION — Construction in Progress</title>
<style>
  @page { size: Letter portrait; margin: 0.4in; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    color: #000;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .sign {
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #fcd116;
    border: 10px solid #000;
    border-radius: 14px;
    padding: 18px;
  }
  .header {
    flex: 0 0 22%;
    background: #000;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .header .word {
    color: #fcd116;
    font-size: 110pt;
    font-weight: 900;
    letter-spacing: 0.04em;
    line-height: 1;
  }
  .body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 18px 8px;
  }
  .body .line {
    font-size: 96pt;
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
  <div class="sign">
    <div class="header"><div class="word">CAUTION</div></div>
    <div class="body">
      <div class="line">CONSTRUCTION</div>
      <div class="line">IN PROGRESS</div>
    </div>
  </div>
</body>
</html>
