<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CAUTION — Construction in Progress</title>
<style>
  @page { size: Letter landscape; margin: 0.4in; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
    color: #000;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .sign {
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #fcd116;
    border: 10px solid #000;
    border-radius: 14px;
    padding: 18px;
    gap: 16px;
  }
  .header {
    flex: 0 0 28%;
    background: #000;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 24px;
  }
  .header svg { width: 100%; height: 100%; }
  .body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 12px;
  }
  .body svg { width: 100%; height: 100%; }
</style>
</head>
<body>
  <div class="sign">
    <div class="header">
      <svg viewBox="0 0 100 22" preserveAspectRatio="xMidYMid meet" aria-label="CAUTION">
        <text x="50" y="19" text-anchor="middle"
              textLength="92" lengthAdjust="spacingAndGlyphs"
              font-family="Arial Black, Helvetica, sans-serif"
              font-weight="900" font-size="20" fill="#fcd116">CAUTION</text>
      </svg>
    </div>
    <div class="body">
      <svg viewBox="0 0 100 32" preserveAspectRatio="xMidYMid meet" aria-label="CONSTRUCTION IN PROGRESS">
        <text x="50" y="14" text-anchor="middle"
              textLength="94" lengthAdjust="spacingAndGlyphs"
              font-family="Arial Black, Helvetica, sans-serif"
              font-weight="900" font-size="13" fill="#000">CONSTRUCTION</text>
        <text x="50" y="30" text-anchor="middle"
              textLength="86" lengthAdjust="spacingAndGlyphs"
              font-family="Arial Black, Helvetica, sans-serif"
              font-weight="900" font-size="13" fill="#000">IN PROGRESS</text>
      </svg>
    </div>
  </div>
</body>
</html>
