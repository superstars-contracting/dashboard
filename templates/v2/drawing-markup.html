<!DOCTYPE html>
<!-- DRAWING MARKUP — north elevation, per-drop per-floor work status (#280).

     Distinct from /dropplan (#201/#256), which is the per-drop LIFECYCLE schedule and is
     untouched by this build. This page is the interactive drawing.

     TWO AUDIENCES, ONE VIEW. Internal (admin/c_suite/pm/super/estimator) and external
     (architect/client) see the SAME drawing: same DROP n labels, same grid bubbles, same
     dimension strings, same statuses including rework, same reason text. They differ only
     in WRITE rights — internal roles get paint mode; architect writes comments/RFIs;
     client is read-only. The server decides all of it; nothing here is a visibility check.

     Everything drawn comes from the API: geometry from elevation.geometry_json, status
     colours from status_tone via tone names. No status hex appears in this file. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drawing Markup · Superstars Contracting</title>
<link rel="stylesheet" href="/files/static/v2/v2.css">
<style>
  .wrap { max-width: 1400px; margin: 0 auto; padding: var(--v2-s-5) var(--v2-s-4) 64px; }
  header.top { display:flex; align-items:flex-start; gap:var(--v2-s-4); flex-wrap:wrap;
               margin-bottom:var(--v2-s-3); }
  h1 { font-size:var(--v2-t-title); font-weight:700; margin:0 0 2px; letter-spacing:-.2px; }
  .sub { color:var(--v2-ink-mute); font-size:var(--v2-t-small); margin:0; }
  .meta { margin-left:auto; text-align:right; color:var(--v2-ink-mute);
          font-size:var(--v2-t-micro); line-height:1.7; }
  .meta b { color:var(--v2-ink-soft); font-weight:600; }

  .toolbar { display:flex; gap:var(--v2-s-2); align-items:center; flex-wrap:wrap;
             margin:var(--v2-s-3) 0; }
  .spacer { flex:1 1 auto; }

  /* drop tabs — DROP n for EVERY role, with the grid span beneath */
  .tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; }
  .tab { flex:none; min-width:74px; border:1px solid var(--v2-hairline); background:var(--v2-surface);
         border-radius:var(--v2-r-ctl); padding:6px 9px; cursor:pointer; font:inherit;
         text-align:center; line-height:1.25; }
  .tab:hover { border-color:var(--v2-accent-edge); }
  .tab[aria-selected="true"] { border-color:var(--v2-accent); background:var(--v2-accent-chip); }
  .tab .n { display:block; font-size:var(--v2-t-micro); font-weight:700; letter-spacing:.04em; }
  .tab .g { display:block; font-size:10px; color:var(--v2-ink-mute); font-variant-numeric:tabular-nums; }
  .tab .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-top:3px; }

  /* The drawing is intrinsically wide (265 ft at 4 px/ft). It must scroll INSIDE its own
     container — the page body must never scroll horizontally.
     A grid/flex child defaults to min-width:auto, which means it refuses to shrink below
     its content and pushes the whole page wide instead of letting overflow-x engage.
     min-width:0 on the track is what actually makes the scroller work. */
  .stage { overflow-x:auto; max-width:100%; }
  svg.elev { display:block; min-width:900px; height:auto; }

  .legend { display:flex; gap:var(--v2-s-3); flex-wrap:wrap; align-items:center;
            margin-top:var(--v2-s-3); }

  .cols { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:var(--v2-s-4);
          align-items:start; margin-top:var(--v2-s-4); }
  .cols > * { min-width:0; }          /* let the drawing column shrink so .stage scrolls */
  @media (max-width: 1000px) { .cols { grid-template-columns:minmax(0,1fr); } }
  .tabs::-webkit-scrollbar, .stage::-webkit-scrollbar { height:8px; }
  .tabs::-webkit-scrollbar-thumb, .stage::-webkit-scrollbar-thumb {
    background:var(--v2-hairline); border-radius:4px; }

  .panel h2 { font-size:var(--v2-t-lead); font-weight:700; margin:0 0 2px; }
  .panel .psub { color:var(--v2-ink-mute); font-size:var(--v2-t-small); margin:0 0 var(--v2-s-3); }
  table.floors { width:100%; border-collapse:collapse; font-size:var(--v2-t-small); }
  table.floors th { text-align:left; font-size:var(--v2-t-micro); color:var(--v2-ink-mute);
                    font-weight:600; padding:0 0 6px; }
  table.floors td { padding:7px 0; border-top:1px solid var(--v2-hairline); vertical-align:top; }
  table.floors td.lv { font-weight:600; white-space:nowrap; padding-right:10px; }
  .reason { color:var(--v2-ink-soft); font-size:var(--v2-t-micro); margin-top:3px;
            line-height:1.5; word-break:break-word; }
  .inote { color:var(--v2-gold-ink); background:var(--v2-gold-chip);
           border-radius:5px; padding:3px 7px; font-size:10.5px; margin-top:4px;
           display:inline-block; word-break:break-word; }
  .dl { display:grid; grid-template-columns:auto 1fr; gap:3px 12px; font-size:var(--v2-t-small);
        margin:var(--v2-s-3) 0; }
  .dl dt { color:var(--v2-ink-mute); font-size:var(--v2-t-micro); }
  .dl dd { margin:0; font-variant-numeric:tabular-nums; }

  .paintbar { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .swatch { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--v2-hairline);
            background:var(--v2-surface); border-radius:999px; padding:4px 11px 4px 8px;
            cursor:pointer; font:inherit; font-size:var(--v2-t-micro); font-weight:600; }
  .swatch[aria-pressed="true"] { border-color:var(--v2-accent); background:var(--v2-accent-chip); }
  .swatch i { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .cell-hit { cursor:pointer; }
  .cell-hit:hover { stroke:var(--v2-accent); stroke-width:2; }

  dialog.rsn { border:1px solid var(--v2-hairline); border-radius:var(--v2-r-card);
               padding:var(--v2-s-4); max-width:420px; width:92vw; font-family:var(--v2-font); }
  dialog.rsn::backdrop { background:rgba(35,33,29,.35); }
  dialog.rsn h3 { margin:0 0 4px; font-size:var(--v2-t-lead); }
  dialog.rsn p { margin:0 0 var(--v2-s-3); color:var(--v2-ink-mute); font-size:var(--v2-t-small); }
  dialog.rsn label { display:block; font-size:var(--v2-t-micro); font-weight:600; margin:0 0 4px; }
  dialog.rsn textarea { width:100%; font:inherit; font-size:var(--v2-t-small); padding:8px 10px;
                        border:1px solid var(--v2-hairline); border-radius:var(--v2-r-ctl);
                        resize:vertical; min-height:64px; }
  .err { color:var(--v2-coral-ink); font-size:var(--v2-t-micro); margin-top:6px; }
  .empty { color:var(--v2-ink-mute); font-size:var(--v2-t-small); padding:var(--v2-s-3) 0; }
</style>
</head>
<body class="v2">
<div class="wrap">

  <header class="top">
    <div>
      <h1 id="title">Drawing Markup</h1>
      <p class="sub" id="subtitle">Loading…</p>
    </div>
    <div class="meta" id="sheetmeta"></div>
  </header>

  <div id="basisnote" class="v2-note v2-no-print" hidden></div>

  <div class="toolbar v2-no-print">
    <button type="button" class="v2-btn-ghost" id="patterns" aria-pressed="false">Patterns</button>
    <button type="button" class="v2-btn-ghost" id="printbtn">Print</button>
    <div class="spacer"></div>
    <div class="paintbar" id="paintbar" hidden></div>
  </div>

  <div class="tabs v2-no-print" id="tabs" role="tablist"></div>

  <div class="cols">
    <div class="v2-card">
      <div class="stage" id="stage"></div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="v2-card panel" id="panel">
      <h2 id="p-title">Select a drop</h2>
      <p class="psub" id="p-sub">Choose a drop above to see status by floor.</p>
      <div id="p-body"></div>
    </div>
  </div>
</div>

<dialog class="rsn" id="rsnDlg">
  <h3 id="rsn-h">Reason required</h3>
  <p id="rsn-p">This status needs a reason. It is shown to the architect and the client.</p>
  <label for="rsn-t">Reason</label>
  <textarea id="rsn-t" maxlength="500" placeholder="What you would say to the architect's face."></textarea>
  <div id="rsn-inote-wrap" style="margin-top:12px">
    <label for="rsn-i">Internal note <span style="font-weight:400;color:var(--v2-ink-mute)">— never leaves the building</span></label>
    <textarea id="rsn-i" maxlength="2000" placeholder="Anything you would not say to their face."></textarea>
  </div>
  <div class="err" id="rsn-err" hidden></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
    <button type="button" class="v2-btn-ghost" id="rsn-cancel">Cancel</button>
    <button type="button" class="v2-btn" id="rsn-ok">Apply</button>
  </div>
</dialog>

<script>
(function () {
  'use strict';

  var S = { data:null, elevId:null, drop:null, patterns:false, paint:null, byDrop:{}, meta:{} };
  var $ = function (id) { return document.getElementById(id); };
  var SVGNS = 'http://www.w3.org/2000/svg';

  // Glyph per status. THE GLYPH IS ALWAYS RENDERED, never colour alone — colour alone is
  // unreadable to a protanope and vanishes in a black-and-white print of the sheet.
  var GLYPH = { not_started:'', in_progress:'/', on_hold:'=', rework:'X', complete:'*' };

  function esc(s) { var d = document.createElement('div'); d.textContent = (s == null ? '' : String(s)); return d.innerHTML; }
  function toneVar(tone) { return 'var(--v2-' + (tone || 'neutral') + '-mark)'; }
  function toneChip(tone) { return 'var(--v2-' + (tone || 'neutral') + '-chip)'; }
  function statusOf(k) { return (S.data && S.data.statuses && S.data.statuses[k]) || { key:k, label:k||'—', tone:'neutral' }; }

  function el(tag, attrs, text) {
    var n = document.createElementNS(SVGNS, tag);
    for (var k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }

  // ---------- geometry transform -------------------------------------------
  // Feet -> SVG units. y is measured UP from grade in the trace and DOWN in SVG.
  var PPF = 4.0, PAD_L = 66, PAD_R = 26, PAD_T = 44, PAD_B = 84;
  function X(ft) { return PAD_L + ft * PPF; }
  function Y(ft) { return PAD_T + (S.data.geometry.facade.draw_top_ft - ft) * PPF; }

  function defs() {
    var d = el('defs');
    // CMU coursing — the field pattern, drawn light so status reads over it.
    var cmu = el('pattern', { id:'cmu', width:32, height:8, patternUnits:'userSpaceOnUse' });
    cmu.appendChild(el('rect', { width:32, height:8, fill:'var(--v2-surface)' }));
    cmu.appendChild(el('path', { d:'M0 8 H32 M16 0 V8', stroke:'#e9e5de', 'stroke-width':1 }));
    d.appendChild(cmu);
    // Status hatches for the patterns toggle: distinct ANGLE per status, so the fill is
    // still distinguishable in greyscale and under any colour-vision deficiency.
    var angles = { in_progress:45, on_hold:0, rework:-45, complete:90, not_started:null };
    Object.keys(angles).forEach(function (k) {
      if (angles[k] === null) return;
      var p = el('pattern', { id:'h-'+k, width:8, height:8, patternUnits:'userSpaceOnUse',
                              patternTransform:'rotate(' + angles[k] + ')' });
      p.appendChild(el('rect', { width:8, height:8, fill:toneChip(statusOf(k).tone) }));
      p.appendChild(el('path', { d:'M0 0 V8', stroke:toneVar(statusOf(k).tone), 'stroke-width':2.4 }));
      d.appendChild(p);
    });
    return d;
  }

  // ---------- the drawing ---------------------------------------------------
  function render() {
    var g = S.data.geometry, f = g.facade;
    var W = X(f.width_ft) + PAD_R, H = Y(0) + PAD_B;
    var svg = el('svg', { class:'elev', viewBox:'0 0 ' + W + ' ' + H,
                          role:'img', 'aria-label':'North elevation drop plan' });
    svg.appendChild(defs());

    // facade field
    svg.appendChild(el('rect', { x:X(0), y:Y(f.height_ft), width:f.width_ft*PPF,
                                 height:f.height_ft*PPF, fill:'url(#cmu)',
                                 stroke:'var(--v2-ink-soft)', 'stroke-width':1.2 }));

    // ---- status cells: one per (drop, level) ----
    var lv = {}; g.levels.forEach(function (l) { lv[l.id] = l; });
    var cellsG = el('g', { class:'cells' });
    (S.data.cells || []).forEach(function (c) {
      var d = S.byDrop[c.drop_id]; if (!d) return;
      var L = lv[c.level_id]; if (!L) return;
      var st = statusOf(c.status);
      var x = X(d.x0), y = Y(L.top), w = (d.x1 - d.x0) * PPF, h = (L.top - L.bot) * PPF;
      var fill = c.status === 'not_started' ? 'transparent'
               : (S.patterns ? 'url(#h-' + c.status + ')' : toneChip(st.tone));
      var r = el('rect', { x:x, y:y, width:w, height:h, fill:fill,
                           stroke:toneVar(st.tone),
                           'stroke-width': c.status === 'not_started' ? 0.6 : 1.4,
                           'stroke-opacity': c.status === 'not_started' ? 0.5 : 1,
                           class:'cell-hit', 'data-cell':c.id, 'data-drop':c.drop_id });
      var t = document.createElementNS(SVGNS, 'title');
      t.textContent = 'DROP ' + d.idx + ' · ' + c.level_name + ' · ' + st.label +
                      (c.reason ? ' — ' + c.reason : '');
      r.appendChild(t);
      cellsG.appendChild(r);
      // glyph — always drawn alongside the fill
      if (GLYPH[c.status]) {
        cellsG.appendChild(el('text', { x:x + w/2, y:y + h/2 + 4, 'text-anchor':'middle',
          'font-size':12, 'font-weight':700, fill:toneVar(st.tone),
          'pointer-events':'none' }, GLYPH[c.status]));
      }
    });
    svg.appendChild(cellsG);

    // ---- window openings (punched) ----
    var op = el('g', { class:'openings' });
    (g.openings || []).forEach(function (o) {
      op.appendChild(el('rect', { x:X(o.x0), y:Y(o.top), width:(o.x1-o.x0)*PPF,
        height:(o.top-o.bot)*PPF, fill:'#f4f1ea', stroke:'var(--v2-ink-soft)',
        'stroke-width':0.9, 'pointer-events':'none' }));
    });
    svg.appendChild(op);

    // ---- structural columns. Grid 13 is deliberately absent: it lands mid-window in
    //      the stair tower, not on a pier, so no column is drawn there. ----
    var cg = el('g');
    (g.columns || []).forEach(function (c) {
      cg.appendChild(el('rect', { x:X(c.x0), y:Y(g.facade.height_ft),
        width:(c.x1-c.x0)*PPF, height:g.facade.height_ft*PPF,
        fill:'#ded9d0', stroke:'var(--v2-ink-soft)', 'stroke-width':0.7,
        'pointer-events':'none' }));
    });
    svg.appendChild(cg);

    // ---- features: bulkheads (above parapet), overhead door, stair tower ----
    var fg = el('g');
    (g.features.bulkheads || []).forEach(function (b) {
      fg.appendChild(el('rect', { x:X(b.x0), y:Y(b.top), width:(b.x1-b.x0)*PPF,
        height:(b.top - g.constants.parapet_top)*PPF, fill:'#f2efe9',
        stroke:'var(--v2-ink-mute)', 'stroke-width':0.9, 'stroke-dasharray':'0' }));
      fg.appendChild(el('text', { x:X((b.x0+b.x1)/2), y:Y(b.top) - 5, 'text-anchor':'middle',
        'font-size':8.5, fill:'var(--v2-ink-mute)', 'letter-spacing':'.06em' }, b.label));
    });
    var od = g.features.overhead_door;
    if (od) {
      fg.appendChild(el('rect', { x:X(od.x0), y:Y(od.top), width:(od.x1-od.x0)*PPF,
        height:(od.top-od.bot)*PPF, fill:'#e6e1d8', stroke:'var(--v2-ink-soft)',
        'stroke-width':1.1 }));
      fg.appendChild(el('text', { x:X((od.x0+od.x1)/2), y:Y(od.bot) - 9, 'text-anchor':'middle',
        'font-size':8.5, fill:'var(--v2-ink-soft)' }, 'OVERHEAD DOOR'));
    }
    var st = g.features.stair_tower;
    if (st) {
      var bands = st.bands || 1, bh = (st.top - st.bot) / bands;
      for (var i = 0; i < bands; i++) {
        fg.appendChild(el('rect', { x:X(st.x0), y:Y(st.bot + (i+1)*bh),
          width:(st.x1-st.x0)*PPF, height:bh*PPF - 1.2, fill:'#f4f1ea',
          stroke:'var(--v2-ink-soft)', 'stroke-width':0.7 }));
      }
    }
    var ep = g.features.east_pier;
    if (ep) {
      fg.appendChild(el('rect', { x:X(ep.x0), y:Y(g.facade.height_ft),
        width:(ep.x1-ep.x0)*PPF, height:g.facade.height_ft*PPF, fill:'#ded9d0',
        stroke:'var(--v2-ink-soft)', 'stroke-width':0.7 }));
    }
    svg.appendChild(fg);

    // ---- parapet ----
    svg.appendChild(el('line', { x1:X(0), y1:Y(g.constants.parapet_top),
      x2:X(f.width_ft), y2:Y(g.constants.parapet_top),
      stroke:'var(--v2-ink)', 'stroke-width':1.6 }));

    // ---- datum lines. SOLID hairlines, never dashed. ----
    var dg = el('g');
    (g.datums || []).forEach(function (d) {
      dg.appendChild(el('line', { x1:X(0) - 44, y1:Y(d.y), x2:X(f.width_ft), y2:Y(d.y),
        stroke:'#d9d4cb', 'stroke-width':0.8 }));
      dg.appendChild(el('text', { x:X(0) - 48, y:Y(d.y) - 3, 'text-anchor':'end',
        'font-size':8, fill:'var(--v2-ink-mute)', 'letter-spacing':'.05em' }, d.name));
      dg.appendChild(el('text', { x:X(0) - 48, y:Y(d.y) + 7, 'text-anchor':'end',
        'font-size':7.5, fill:'var(--v2-ink-mute)', class:'v2-num' },
        d.y.toFixed(2) + "'"));
    });
    svg.appendChild(dg);

    // ---- grid bubbles ----
    var gg = el('g');
    (g.grids || []).forEach(function (gr) {
      gg.appendChild(el('line', { x1:X(gr.x), y1:PAD_T - 12, x2:X(gr.x), y2:Y(0),
        stroke:'#ddd8cf', 'stroke-width':0.7 }));
      gg.appendChild(el('circle', { cx:X(gr.x), cy:PAD_T - 22, r:10.5,
        fill:'var(--v2-surface)', stroke:'var(--v2-ink-soft)', 'stroke-width':1 }));
      gg.appendChild(el('text', { x:X(gr.x), y:PAD_T - 18.5, 'text-anchor':'middle',
        'font-size':9.5, 'font-weight':700, fill:'var(--v2-ink)' }, gr.id));
    });
    svg.appendChild(gg);

    // ---- drop boundaries + DROP n labels + clear-bay dimension strings ----
    var yDim = Y(0) + 26, yLab = Y(0) + 52;
    var bg = el('g');
    (S.data.drops || []).forEach(function (d) {
      var gd = (g.drops || []).filter(function (x) { return x.idx === d.idx; })[0] || {};
      bg.appendChild(el('line', { x1:X(d.x0), y1:Y(0), x2:X(d.x0), y2:yDim + 6,
        stroke:'#cfc9be', 'stroke-width':0.8 }));
      // dimension string AS WRITTEN on the sheet — never recomputed from scaled widths
      bg.appendChild(el('line', { x1:X(d.x0)+2, y1:yDim, x2:X(d.x1)-2, y2:yDim,
        stroke:'var(--v2-ink-mute)', 'stroke-width':0.8 }));
      bg.appendChild(el('text', { x:X((d.x0+d.x1)/2), y:yDim - 4, 'text-anchor':'middle',
        'font-size':8.5, fill:'var(--v2-ink-soft)', class:'v2-num' }, gd.clear_bay || ''));
      var dst = statusOf(d.derived_status);
      bg.appendChild(el('rect', { x:X(d.x0)+3, y:yLab-13, width:(d.x1-d.x0)*PPF-6, height:19,
        rx:5, fill:toneChip(dst.tone), stroke:toneVar(dst.tone), 'stroke-width':1 }));
      bg.appendChild(el('text', { x:X((d.x0+d.x1)/2), y:yLab, 'text-anchor':'middle',
        'font-size':9.5, 'font-weight':700, fill:'var(--v2-ink)' }, 'DROP ' + d.idx));
      bg.appendChild(el('text', { x:X((d.x0+d.x1)/2), y:yLab + 14, 'text-anchor':'middle',
        'font-size':8, fill:'var(--v2-ink-mute)', class:'v2-num' },
        'GL ' + d.grid_from + '–' + d.grid_to));
    });
    bg.appendChild(el('line', { x1:X(S.data.geometry.facade.width_ft), y1:Y(0),
      x2:X(S.data.geometry.facade.width_ft), y2:yDim + 6, stroke:'#cfc9be', 'stroke-width':0.8 }));
    svg.appendChild(bg);

    $('stage').innerHTML = '';
    $('stage').appendChild(svg);

    Array.prototype.forEach.call(svg.querySelectorAll('.cell-hit'), function (r) {
      r.addEventListener('click', function () { onCell(r.getAttribute('data-cell')); });
    });
  }

  // ---------- legend, tabs, panel -------------------------------------------
  function renderLegend() {
    var box = $('legend'); box.innerHTML = '';
    Object.keys(S.data.statuses).forEach(function (k) {
      var s = S.data.statuses[k];
      var c = document.createElement('span');
      c.className = 'v2-chip v2-tone-' + s.tone;
      c.textContent = s.label + (GLYPH[k] ? '  ' + GLYPH[k] : '');
      box.appendChild(c);
    });
  }

  function renderTabs() {
    var t = $('tabs'); t.innerHTML = '';
    (S.data.drops || []).forEach(function (d) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'tab'; b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(S.drop === d.id));
      var s = statusOf(d.derived_status);
      b.innerHTML = '<span class="n">DROP ' + d.idx + '</span>' +
                    '<span class="g">GL ' + esc(d.grid_from) + '–' + esc(d.grid_to) + '</span>' +
                    '<span class="dot" style="background:' + toneVar(s.tone) + '"></span>';
      b.addEventListener('click', function () { S.drop = d.id; renderTabs(); renderPanel(); });
      t.appendChild(b);
    });
  }

  function cellsOf(dropId) {
    return (S.data.cells || []).filter(function (c) { return c.drop_id === dropId; });
  }

  function renderPanel() {
    var d = S.byDrop[S.drop];
    if (!d) { return; }
    var gd = (S.data.geometry.drops || []).filter(function (x) { return x.idx === d.idx; })[0] || {};
    var ds = statusOf(d.derived_status);
    $('p-title').textContent = 'DROP ' + d.idx;
    $('p-sub').innerHTML = 'GL ' + esc(d.grid_from) + '–' + esc(d.grid_to) +
      ' · <span class="v2-chip v2-tone-' + ds.tone + '">' + esc(ds.label) + '</span>' +
      ' <span style="color:var(--v2-ink-mute)">(from floors)</span>';

    var rows = cellsOf(d.id).slice().sort(function (a, b) {
      return a.level_id < b.level_id ? 1 : -1;     // top floor first, as drawn
    });
    var html = '<dl class="dl">' +
      '<dt>Width</dt><dd>' + esc((d.width_ft || 0).toFixed(2)) + ' ft</dd>' +
      '<dt>Area</dt><dd>' + esc(d.area_sf) + ' sf</dd>' +
      '<dt>Clear bay</dt><dd>' + esc(gd.clear_bay || '—') + '</dd>' +
      '</dl>';
    if (d.note) html += '<p class="reason">' + esc(d.note) + '</p>';

    html += '<table class="floors"><thead><tr><th>Floor</th><th>Status</th></tr></thead><tbody>';
    rows.forEach(function (c) {
      var s = statusOf(c.status);
      html += '<tr><td class="lv">' + esc(c.level_name) + '</td><td>' +
              '<span class="v2-chip v2-tone-' + s.tone + '">' + esc(s.label) + '</span>';
      if (c.reason) html += '<div class="reason">' + esc(c.reason) + '</div>';
      if (c.internal_note) html += '<div class="inote">Internal: ' + esc(c.internal_note) + '</div>';
      html += '</td></tr>';
    });
    html += '</tbody></table>';
    $('p-body').innerHTML = html;
  }

  // ---------- painting ------------------------------------------------------
  function renderPaintbar() {
    if (!S.data.can_paint) return;
    var bar = $('paintbar'); bar.hidden = false; bar.innerHTML = '';
    var lab = document.createElement('span');
    lab.style.cssText = 'font-size:var(--v2-t-micro);color:var(--v2-ink-mute);font-weight:600';
    lab.textContent = 'Paint:';
    bar.appendChild(lab);
    Object.keys(S.data.statuses).forEach(function (k) {
      var s = S.data.statuses[k];
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'swatch';
      b.setAttribute('aria-pressed', String(S.paint === k));
      b.innerHTML = '<i style="background:' + toneVar(s.tone) + '"></i>' + esc(s.label);
      b.addEventListener('click', function () {
        S.paint = (S.paint === k) ? null : k; renderPaintbar();
      });
      bar.appendChild(b);
    });
    var whole = document.createElement('button');
    whole.type = 'button'; whole.className = 'v2-btn-ghost';
    whole.textContent = 'Apply to whole drop';
    whole.addEventListener('click', function () {
      if (!S.paint) { alert('Pick a status first.'); return; }
      if (!S.drop) { alert('Pick a drop first.'); return; }
      askAndSend({ drop_id: S.drop }, S.paint, 'DROP ' + S.byDrop[S.drop].idx + ' — every floor');
    });
    bar.appendChild(whole);
  }

  function onCell(cellId) {
    var c = (S.data.cells || []).filter(function (x) { return String(x.id) === String(cellId); })[0];
    if (!c) return;
    S.drop = c.drop_id; renderTabs(); renderPanel();
    if (!S.data.can_paint || !S.paint) return;
    askAndSend({ cell_id: c.id }, S.paint,
               'DROP ' + S.byDrop[c.drop_id].idx + ' — ' + c.level_name);
  }

  function askAndSend(target, status, whatText) {
    var s = S.data.statuses[status] || {};
    if (!s.reason_required) { send(target, status, null, null); return; }
    var dlg = $('rsnDlg');
    $('rsn-h').textContent = s.label + ' — reason required';
    $('rsn-p').textContent = whatText + '. This reason is shown to the architect and the client.';
    $('rsn-t').value = ''; $('rsn-i').value = ''; $('rsn-err').hidden = true;
    dlg.showModal();
    $('rsn-t').focus();
    $('rsn-ok').onclick = function () {
      var r = $('rsn-t').value.trim();
      if (!r) { $('rsn-err').textContent = 'A reason is required.'; $('rsn-err').hidden = false; return; }
      dlg.close();
      send(target, status, r, $('rsn-i').value.trim() || null);
    };
    $('rsn-cancel').onclick = function () { dlg.close(); };
  }

  function send(target, status, reason, internalNote) {
    var url = target.cell_id ? '/api/elevation/cell' : '/api/elevation/drop';
    var body = Object.assign({ status_key: status }, target);
    if (reason) body.reason = reason;
    if (internalNote) body.internal_note = internalNote;
    fetch(url, { method:'POST', headers:{'Content-Type':'application/json'},
                 credentials:'same-origin', body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { return { ok:r.ok, j:j }; }); })
      .then(function (res) {
        if (!res.ok) { alert(res.j && res.j.error ? res.j.error : 'Could not save'); return; }
        load(S.elevId);
      })
      .catch(function () { alert('Could not save — check your connection and try again.'); });
  }

  // ---------- boot ----------------------------------------------------------
  function paintHeader() {
    var d = S.data;
    $('title').textContent = (d.name || 'Drawing Markup');
    $('subtitle').textContent = (d.project_code || '') +
      (d.project_name ? ' · ' + d.project_name : '');
    var g = d.geometry || {}, src = g.source || {};
    $('sheetmeta').innerHTML =
      (d.source_sheet ? '<b>' + esc(d.source_sheet) + '</b><br>' : '') +
      (src.architect ? esc(src.architect) + '<br>' : '') +
      (d.sheet_date ? 'Issued ' + esc(d.sheet_date) + '<br>' : '') +
      (d.dob_job ? 'DOB ' + esc(d.dob_job) : '');

    // DIMENSION-BASIS NOTE. Wording is deliberate: "scaled — confirm against your current
    // set" is professional caution an engineer expects. "Provisional/placeholder" would
    // read as a red flag about the data itself, which would be both wrong and corrosive.
    if (g.dimension_basis === 'scaled' && g.scale_note) {
      var n = $('basisnote');
      n.innerHTML = '<b>Widths are scaled off the 2022 approved set</b> — confirm ' +
                    'against your current set before using for takeoff.<br>' +
                    '<span style="font-size:var(--v2-t-micro)">' + esc(g.scale_note) + '</span>';
      n.hidden = false;
    }
  }

  function load(id) {
    fetch('/api/elevation/' + id, { credentials:'same-origin' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) {
        S.data = j.data; S.elevId = id;
        S.byDrop = {}; (S.data.drops || []).forEach(function (d) { S.byDrop[d.id] = d; });
        if (!S.drop && S.data.drops && S.data.drops.length) S.drop = S.data.drops[0].id;
        paintHeader(); renderLegend(); renderTabs(); render(); renderPanel(); renderPaintbar();
      })
      .catch(function () {
        $('subtitle').textContent = 'Could not load this elevation.';
      });
  }

  $('patterns').addEventListener('click', function () {
    S.patterns = !S.patterns;
    this.setAttribute('aria-pressed', String(S.patterns));
    render();
  });
  $('printbtn').addEventListener('click', function () { window.print(); });

  var m = location.pathname.match(/\/drawing-markup\/(\d+)/);
  if (m) { load(parseInt(m[1], 10)); }
  else {
    fetch('/api/elevations', { credentials:'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var list = (j && j.data) || [];
        if (!list.length) {
          $('subtitle').textContent = 'No elevation is available for your projects.';
          return;
        }
        S.data = S.data || {};
        load(list[0].id);
      })
      .catch(function () { $('subtitle').textContent = 'Could not load.'; });
  }
})();
</script>
</body>
</html>
