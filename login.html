<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/files/static/fonts/typography.css">
<title>Sign in · Superstars Contracting</title>
<style>
  :root {
    --brand-red: #B11E2E;
    --brand-red-deep: #8B1623;
    --ink: #14161C;
    --cream: #FAF7F1;
    --paper: #FFFFFF;
    --hairline: #E8E4DD;
    --mute: #76777E;
    --bad: #B11E2E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    box-shadow: 0 4px 18px rgba(20,22,28,0.06);
    padding: 32px 32px 28px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
  }
  .brand-mark { width: 40px; height: 40px; flex-shrink: 0; }
  .brand-text { line-height: 1.1; }
  .brand-name {
    font-family: 'Archivo', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--ink);
    text-transform: uppercase;
  }
  .brand-sub {
    font-size: 10px;
    color: var(--mute);
    letter-spacing: 1.2px;
    text-transform: uppercase;
    font-weight: 600;
    margin-top: 2px;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .sub {
    font-size: 13px;
    color: var(--mute);
    margin-bottom: 22px;
  }
  label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--mute);
    margin-bottom: 6px;
    margin-top: 14px;
  }
  input[type="email"], input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  input[type="email"]:focus, input[type="password"]:focus {
    border-color: var(--brand-red);
  }
  .err {
    background: #FBEAEC;
    color: var(--bad);
    border: 1px solid #F1C0C5;
    border-radius: 6px;
    padding: 9px 12px;
    font-size: 13px;
    margin-top: 16px;
    display: none;
  }
  .err.show { display: block; }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 11px 16px;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: white;
    background: var(--brand-red);
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover:not(:disabled) { background: var(--brand-red-deep); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .foot {
    margin-top: 18px;
    font-size: 11px;
    color: var(--mute);
    text-align: center;
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>
<div class="wrap">
  <form class="card" id="login-form" autocomplete="on" novalidate>
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="topRL" x1="0%" y1="0%" x2="70%" y2="100%"><stop offset="0%" stop-color="#E0394E"/><stop offset="100%" stop-color="#A01829"/></linearGradient>
          <linearGradient id="topRD" x1="100%" y1="0%" x2="30%" y2="100%"><stop offset="0%" stop-color="#831321"/><stop offset="100%" stop-color="#4A0A12"/></linearGradient>
        </defs>
        <polygon fill="url(#topRL)" points="50,50 38.78,34.55 50,0"/>
        <polygon fill="url(#topRD)" points="50,50 50,0 61.22,34.55"/>
        <polygon fill="url(#topRL)" points="50,50 61.22,34.55 97.55,34.55"/>
        <polygon fill="url(#topRD)" points="50,50 97.55,34.55 68.16,55.91"/>
        <polygon fill="url(#topRL)" points="50,50 68.16,55.91 79.39,90.45"/>
        <polygon fill="url(#topRD)" points="50,50 79.39,90.45 50,69.1"/>
        <polygon fill="url(#topRL)" points="50,50 50,69.1 20.61,90.45"/>
        <polygon fill="url(#topRD)" points="50,50 20.61,90.45 31.84,55.91"/>
        <polygon fill="url(#topRL)" points="50,50 31.84,55.91 2.45,34.55"/>
        <polygon fill="url(#topRD)" points="50,50 2.45,34.55 38.78,34.55"/>
        <polygon fill="#FAF7F1" points="50,30 55.61,44.27 70.39,44.27 58.39,53.46 63,67.73 50,59.05 37,67.73 41.61,53.46 29.61,44.27 44.39,44.27"/>
      </svg>
      <div class="brand-text">
        <div class="brand-name">Superstars Contracting</div>
        <div class="brand-sub">Office Console</div>
      </div>
    </div>

    <h1>Sign in</h1>
    <div class="sub">Dashboard access for office staff. Workers continue using the worker app.</div>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required autofocus>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <div class="err" id="err" role="alert"></div>

    <button type="submit" id="submit-btn">Sign in</button>

    <div class="foot">Authorized use only.</div>
  </form>
</div>

<script>
(function() {
  const form = document.getElementById('login-form');
  const btn = document.getElementById('submit-btn');
  const err = document.getElementById('err');
  const emailEl = document.getElementById('email');
  const pwEl = document.getElementById('password');

  // Same-origin next= only. Reject absolute URLs, scheme-relative URLs, and
  // anything that doesn't start with "/" to block open-redirect.
  function safeNext() {
    const raw = new URLSearchParams(window.location.search).get('next') || '/';
    if (typeof raw !== 'string') return '/';
    if (!raw.startsWith('/') || raw.startsWith('//')) return '/';
    return raw;
  }

  // #257 — role home: admin -> admin console, c_suite -> company console,
  // pm -> project dashboard. super/external have no onboarded home this phase.
  function roleHome(role) {
    switch (role) {
      case 'admin': return '/admin/users';
      case 'c_suite': return '/';
      case 'pm': return '/dashboard';
      default: return '/';
    }
  }

  function showErr(msg) {
    err.textContent = msg;
    err.classList.add('show');
  }
  function clearErr() {
    err.classList.remove('show');
    err.textContent = '';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErr();
    const email = emailEl.value.trim();
    const password = pwEl.value;
    if (!email || !password) {
      showErr('Email and password are required.');
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ email, password })
      });
      if (res.ok) {
        const j = await res.json().catch(() => ({}));
        const u = (j && j.user) || {};
        // Forced first-login reset takes precedence over any destination.
        if (u.must_reset_password) { window.location.href = '/set-password'; return; }
        // Honor an explicit deep-link (?next=/some/page); otherwise the role home.
        const next = safeNext();
        window.location.href = (next && next !== '/') ? next : roleHome(u.role);
        return;
      }
      if (res.status === 401) {
        showErr('Email or password is incorrect.');
      } else if (res.status === 400) {
        showErr('Please enter your email and password.');
      } else {
        showErr('Sign-in is temporarily unavailable. Try again in a moment.');
      }
    } catch (e) {
      showErr('Could not reach the server.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  });
})();
</script>
</body>
</html>
