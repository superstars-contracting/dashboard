<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Superstars Contracting · Project Portal</title>
<link rel="stylesheet" href="/files/static/fonts/typography.css">
<!-- #264 — read-only CLIENT portal. Curated: project header + high-level progress + a
     progress summary + the photos we explicitly shared. NO financials, NO internal nav,
     NO drop/labor/PII. All data comes from /api/portal/* (server-scoped + per-resource). -->
<style>
  :root{
    --brand-red:#B11E2E;--brand-red-deep:#8B1623;--ink:#14161C;--hairline:#E8E4DD;
    --mute:#76777E;--ok:#2F7C57;--paper:#fff;--canvas:#faf8f5;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--canvas);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  body{min-height:100vh;}
  .topbar{background:#fff;border-bottom:1px solid var(--hairline);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5;}
  .brand{display:flex;align-items:center;gap:11px;min-width:0;}
  .brand svg{width:34px;height:34px;flex:none;}
  .brand-name{font-family:'Archivo',-apple-system,sans-serif;font-size:15px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;line-height:1;}
  .brand-sub{font-size:9px;color:var(--mute);letter-spacing:1px;text-transform:uppercase;font-weight:600;margin-top:3px;}
  .chip{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute);flex:none;}
  .chip b{color:var(--ink);font-weight:600;}
  .chip button{font:inherit;font-size:11px;font-weight:600;color:var(--mute);background:transparent;border:1px solid var(--hairline);border-radius:6px;padding:5px 10px;cursor:pointer;}
  .chip button:hover{color:var(--brand-red);border-color:var(--brand-red);}
  .wrap{max-width:980px;margin:0 auto;padding:22px 20px 60px;}

  .hero{margin:6px 0 22px;}
  .hero .pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--brand-red);background:#fbeceb;padding:4px 10px;border-radius:99px;margin-bottom:10px;}
  .hero h1{font-family:'Archivo',-apple-system,sans-serif;font-size:27px;font-weight:700;line-height:1.15;}
  .hero .addr{color:var(--mute);font-size:14px;margin-top:6px;}
  .status-badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 9px;border-radius:99px;background:var(--ok);color:#fff;margin-left:8px;vertical-align:middle;}

  .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:26px;}
  @media (max-width:640px){.cards{grid-template-columns:1fr;}}
  .card{background:#fff;border:1px solid var(--hairline);border-radius:14px;padding:18px 20px;}
  .card .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);}
  .progress-num{font-size:34px;font-weight:800;font-family:'Archivo',sans-serif;line-height:1;margin:8px 0 4px;}
  .progress-label{font-size:13px;color:var(--mute);font-weight:600;}
  .bar{height:9px;background:#eee7df;border-radius:99px;overflow:hidden;margin-top:14px;}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand-red),#d8453f);border-radius:99px;transition:width .5s;}
  .summary-text{font-size:14px;line-height:1.6;color:var(--ink);margin-top:10px;}
  .summary-meta{font-size:12px;color:var(--mute);margin-top:10px;}

  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:8px 2px 14px;}
  .sec-head h2{font-family:'Archivo',sans-serif;font-size:18px;font-weight:700;}
  .sec-head .cnt{font-size:12px;color:var(--mute);}
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;}
  .ph{background:#fff;border:1px solid var(--hairline);border-radius:12px;overflow:hidden;cursor:pointer;transition:box-shadow .15s,transform .15s;display:block;}
  .ph:hover{box-shadow:0 6px 18px rgba(177,30,46,.10);transform:translateY(-2px);}
  .ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#efe9e1;}
  .ph .meta{padding:10px 12px;}
  .ph .cap{font-size:13px;font-weight:600;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .ph .date{font-size:11px;color:var(--mute);margin-top:5px;}

  .empty{border:1px dashed var(--hairline);border-radius:14px;padding:40px 22px;text-align:center;color:var(--mute);font-size:14px;line-height:1.6;background:#fff;}
  .empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:5px;}
  .foot{text-align:center;color:#b6b0a6;font-size:11px;margin-top:42px;}

  /* lightbox */
  .lb{position:fixed;inset:0;background:rgba(20,18,16,.86);display:none;align-items:center;justify-content:center;padding:18px;z-index:40;}
  .lb.on{display:flex;}
  .lb img{max-width:100%;max-height:82vh;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.5);}
  .lb .cap{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#fff;font-size:14px;padding:0 20px;text-shadow:0 1px 4px rgba(0,0,0,.6);}
  .lb .x{position:absolute;top:16px;right:18px;color:#fff;font-size:30px;line-height:1;cursor:pointer;opacity:.85;background:none;border:none;}
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L15.09 10.26H24L17.55 15.7L20.64 24L12 18.56L3.36 24L6.45 15.7L0 10.26H8.91L12 2Z" fill="none" stroke="#B11E2E" stroke-width="1.5"/></svg>
      <div><div class="brand-name">Superstars</div><div class="brand-sub">Contracting · Inc</div></div>
    </div>
    <div class="chip"><span id="who">—</span><button id="signout">Sign out</button></div>
  </div>

  <div class="wrap" id="wrap">
    <div class="hero"><div class="pill">Project Portal</div><h1 id="proj-name">Loading…</h1><div class="addr" id="proj-addr"></div></div>
    <div id="content"></div>
    <div class="foot" id="build">build #264 · 2026-06-30 · Client portal — read-only, curated, default-deny visibility</div>
  </div>

  <div class="lb" id="lb"><button class="x" id="lb-x" aria-label="Close">×</button><img id="lb-img" alt=""><div class="cap" id="lb-cap"></div></div>

<script>
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function fmtDate(d){ if(!d) return ''; var p=String(d).slice(0,10).split('-'); return p.length===3 ? p[1]+'/'+p[2]+'/'+p[0] : d; }

  document.getElementById('signout').onclick=function(){ fetch('/api/auth/logout',{method:'POST'}).then(function(){window.location.href='/login';}); };

  // user chip (name only — no role/internal links)
  fetch('/api/auth/me').then(function(r){return r.ok?r.json():null;}).then(function(j){
    if(j&&j.user){ document.getElementById('who').innerHTML='<b>'+esc(j.user.display_name||j.user.full_name||j.user.email)+'</b>'; }
  });

  var LB=document.getElementById('lb');
  function openLB(src,cap){ document.getElementById('lb-img').src=src; document.getElementById('lb-cap').textContent=cap||''; LB.classList.add('on'); }
  document.getElementById('lb-x').onclick=function(){LB.classList.remove('on');document.getElementById('lb-img').src='';};
  LB.onclick=function(e){ if(e.target===LB){LB.classList.remove('on');document.getElementById('lb-img').src='';} };

  async function load(){
    var content=document.getElementById('content');
    try{
      var pj=await fetch('/api/portal/project').then(function(r){return r.json();});
      var d=(pj&&pj.data)||{};
      if(!d.project){
        document.getElementById('proj-name').textContent='No project yet';
        document.getElementById('proj-addr').textContent='';
        content.innerHTML='<div class="empty"><strong>Your portal isn’t set up yet</strong>Once your project team grants access, your project and photos will appear here.</div>';
        return;
      }
      document.getElementById('proj-name').innerHTML=esc(d.project.name)+(d.project.status==='active'?'<span class="status-badge">Active</span>':'');
      document.getElementById('proj-addr').textContent=d.project.address||'';
      var pct=Math.max(0,Math.min(100,(d.progress&&d.progress.pct)||0));
      var summary=(d.summary&&d.summary.text)||'';
      var last=(d.summary&&d.summary.last_activity);
      content.innerHTML=
        '<div class="cards">'
        + '<div class="card"><div class="k">Overall progress</div>'
        + '<div class="progress-num">'+pct+'%</div>'
        + '<div class="progress-label">'+esc((d.progress&&d.progress.label)||'')+'</div>'
        + '<div class="bar"><i style="width:'+pct+'%"></i></div></div>'
        + '<div class="card"><div class="k">Project summary</div>'
        + '<div class="summary-text">'+esc(summary)+'</div>'
        + (last?'<div class="summary-meta">Most recent photo: '+fmtDate(last)+'</div>':'')
        + '</div>'
        + '</div>'
        + '<div class="sec-head"><h2>Project Photos</h2><span class="cnt" id="ph-cnt"></span></div>'
        + '<div id="gallery"></div>';
      await loadPhotos();
    }catch(e){
      content.innerHTML='<div class="empty">We couldn’t load your project right now. Please refresh.</div>';
    }
  }

  async function loadPhotos(){
    var g=document.getElementById('gallery');
    try{
      var pr=await fetch('/api/portal/photos').then(function(r){return r.json();});
      var photos=(pr&&pr.data&&pr.data.photos)||[];
      document.getElementById('ph-cnt').textContent=photos.length?(photos.length+' shared'):'';
      if(!photos.length){
        g.outerHTML='<div class="empty" id="gallery"><strong>No photos shared yet</strong>Photos from your project will appear here as the team shares them with you.</div>';
        return;
      }
      g.className='gallery';
      g.innerHTML=photos.map(function(p){
        return '<a class="ph" data-full="'+esc(p.file_url)+'" data-cap="'+esc(p.caption||'')+'">'
          + '<img loading="lazy" src="'+esc(p.thumb_url)+'" alt="'+esc(p.caption||'Project photo')+'">'
          + '<div class="meta"><div class="cap">'+esc(p.caption||'Project photo')+'</div>'
          + '<div class="date">'+fmtDate(p.taken_at)+'</div></div></a>';
      }).join('');
      Array.prototype.forEach.call(g.querySelectorAll('.ph'),function(a){
        a.onclick=function(){ openLB(a.getAttribute('data-full'), a.getAttribute('data-cap')); };
      });
    }catch(e){ g.innerHTML='<div class="empty">Could not load photos.</div>'; }
  }
  load();
</script>
</body>
</html>
